name: Build oper5 local-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-source.yml'
      - 'scripts/localize_oper5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert current page to local-only mode
        run: python scripts/localize_oper5.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8', errors='replace')
          scripts='\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>', h, re.S|re.I))
          Path('/tmp/oper5-all.js').write_text(scripts, encoding='utf-8')
          PY
          node --check /tmp/oper5-all.js

      - name: Check local-only dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8', errors='replace')
          blocked=['firestore.googleapis.com','identitytoolkit.googleapis.com','securetoken.googleapis.com','fonts.googleapis.com']
          found=[x for x in blocked if x in t]
          if found:
            raise SystemExit('External runtime dependency remains: '+', '.join(found))
          print('Local-only dependency check passed.')
          PY

      - name: Commit local-only site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html geo.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Deploy oper5 local-only version'
            git push
          fi
